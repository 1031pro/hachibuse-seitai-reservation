<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><title>通信確認</title></head>
<body><h1>通信確認</h1><p>予約データは変更しません。</p>
<label>検証用接続先 <input id="endpoint" type="url" size="100"></label>
<button id="check">POST通信を確認</button><pre id="result">未実行</pre>
<script src="api-client.js?v=20260907-post"></script><script>
document.getElementById('check').onclick=function(){
  var result=document.getElementById('result');result.textContent='確認中';
  ReservationApiClient.request(document.getElementById('endpoint').value,{action:'transportFetchProbe'},function(error,data,meta){
    result.textContent=JSON.stringify({error:error&&error.message,data:data,durationMs:meta.durationMs});
  },{timeoutMs:20000,maxAttempts:1});
};
</script></body></html>
